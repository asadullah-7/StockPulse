<div class="container-fluid py-4">
  <!-- Header Section -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold mb-0 text-dark">User Management 👥</h3>
      <p class="text-muted small mb-0">Manage system roles, accounts, and credentials</p>
    </div>
    <button *ngIf="showListArea" class="btn btn-primary fw-bold rounded-pill px-4 shadow-sm" (click)="navigateToAdd()">
      + Add New User
    </button>
  </div>

  <!-- Table View -->
  <div *ngIf="showListArea" class="card border-0 shadow-sm rounded-4 overflow-hidden">
    <div class="card-body p-0">
      <div *ngIf="isLoading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="text-muted mt-2">Loading Users...</p>
      </div>

      <div *ngIf="!isLoading" class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="bg-light">
            <tr>
              <th class="ps-4">User Name</th>
              <th>Email</th>
              <th>Role</th>
              <th class="text-end pe-4">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of users">
              <td class="ps-4 fw-semibold">{{ user.userName || user.UserName }}</td>
              <td>{{ user.email || user.Email }}</td>
              <td>
                <span class="badge rounded-pill" 
                      [ngClass]="(user.role || user.Role) === 'Admin' ? 'bg-danger' : 'bg-info text-dark'">
                  {{ user.role || user.Role || 'User' }}
                </span>
              </td>
              <td class="text-end pe-4">
                <button class="btn btn-sm btn-outline-warning rounded-pill me-2 px-3" (click)="navigateToEdit(user)">
                  Edit
                </button>
                <button class="btn btn-sm btn-outline-danger rounded-pill px-3" (click)="onDelete(user.id || user.Id, user.userName || user.UserName)">
                  Delete
                </button>
              </td>
            </tr>
            <tr *ngIf="users.length === 0">
              <td colspan="4" class="text-center py-4 text-muted">No users found.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Form Section (Add / Edit) -->
  <div *ngIf="!showListArea" class="card border-0 shadow-sm rounded-4 p-4 col-md-8 mx-auto">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="fw-bold text-dark">{{ isEditMode ? 'Edit User' : 'Create New User' }} 📝</h4>
      <button class="btn btn-outline-secondary btn-sm rounded-pill" (click)="goBackToList()">Back to List</button>
    </div>

    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label fw-semibold">User Name</label>
        <input type="text" class="form-control" formControlName="UserName" placeholder="e.g. jondoe">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Email Address</label>
        <input type="email" class="form-control" formControlName="Email" placeholder="user@ims.com">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Password {{ isEditMode ? '(Leave blank to keep unchanged)' : '' }}</label>
        <input type="password" class="form-control" formControlName="Password" placeholder="••••••••">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Role</label>
        <select class="form-select" formControlName="Role">
          <option value="User">User</option>
          <option value="Admin">Admin</option>
        </select>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-4">
        <button type="button" class="btn btn-light rounded-pill px-4" (click)="goBackToList()">Cancel</button>
        <button type="submit" class="btn btn-primary rounded-pill px-4" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Saving...' : (isEditMode ? 'Update User' : 'Create User') }}
        </button>
      </div>
    </form>
  </div>
</div>
